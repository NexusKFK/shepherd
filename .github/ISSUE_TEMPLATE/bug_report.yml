name: 问题报告 · Bug report
description: App 出错、算错或显示不对 · Something is wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "请不要贴真实的账户、持仓或净值。用演示模式（文件 → 打开演示）能复现最好。Please do not paste real account data; reproduce in demo mode if you can."
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 · What happened
      description: 你做了什么，看到了什么，原本以为会看到什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 · Steps to reproduce
      placeholder: "1. 打开演示\n2. 进入风险页\n3. ..."
  - type: input
    id: version
    attributes:
      label: 版本 · Version
      description: 侧栏左下角的版本号，以及 macOS 版本。
      placeholder: "Shepherd 1.3.0 · macOS 15.5"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 日志 · Log (optional)
      description: "~/Library/Application Support/Shepherd/TradingDesk/native-engine.log 的最后几十行（请先删掉里面的个人数据）。"
      render: text
